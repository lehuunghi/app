name: Build mobile test apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --ignore-scripts
      - run: npm run mobile:build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: webmail-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: xcodebuild -version
      - run: npm ci --ignore-scripts
      - run: npm run mobile:build
      - run: npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Debug-iphonesimulator/App.app webmail-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: webmail-ios-simulator
          path: webmail-ios-simulator.zip
          if-no-files-found: error
      - name: Launch the iOS app on a simulator
        run: node scripts/ios-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-app-smoke-test
          path: ios-smoke
          if-no-files-found: warn

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: webmail-android-debug
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          script: node scripts/android-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-app-smoke-test
          path: android-smoke
          if-no-files-found: warn

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run mobile:build
      - run: npm run build -w server
      - run: npm install --prefix .ui-tools --no-save --package-lock=false playwright
      - run: google-chrome --version
      - run: node scripts/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-ui-smoke-test
          path: ui-smoke
          if-no-files-found: warn

  publish:
    needs: [android-smoke, ios, ui-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: webmail-android-debug
          path: release-builds/android
      - uses: actions/download-artifact@v4
        with:
          name: webmail-ios-simulator
          path: release-builds/ios
      - run: node scripts/publish-mobile.mjs
        env:
          GH_TOKEN: ${{ github.token }}
