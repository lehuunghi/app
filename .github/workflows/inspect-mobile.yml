name: Inspect mobile build artifact
on:
  push:
    branches: [inspect-mobile-build4]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-app-smoke-test
          run-id: 37063536132
          github-token: ${{ github.token }}
          path: diagnosis
      - name: Print accessibility failure report
        run: |
          node -e "const fs=require('fs');for(const f of ['report.json','failure.xml']){const p='diagnosis/'+f;if(fs.existsSync(p))console.log(f+'\\n'+fs.readFileSync(p,'utf8'));}"
